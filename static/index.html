<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pyckets</title>
    <link rel="stylesheet" href="/static/styles.css?v=final">
</head>
<body>
    <div class="app-layout">
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="logo">🚀 <span>Pyckets</span></div>
                <button id="toggle-sidebar" class="icon-btn" title="Colapsar menú ( [ )">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
                </button>
            </div>
            <div class="sidebar-actions">
                <button id="sidebar-new-ticket" class="btn primary full-width">
                    <span class="icon">+</span> <span class="text">Nuevo Ticket</span>
                </button>
                <button class="btn secondary full-width search-btn" id="focus-search">
                    <span class="icon">🔍</span> <span class="text">Buscar...</span>
                    <kbd>Ctrl+K</kbd>
                </button>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section">
                    <span class="section-title">Vistas Globales</span>
                    <a href="#" class="nav-item active">
                        <span class="icon">🏠</span> <span class="text">Tablero Actual</span>
                    </a>
                    <a href="#" class="nav-item">
                        <span class="icon">👤</span> <span class="text">Mis Tickets</span>
                    </a>
                </div>
                <div class="nav-section">
                    <div class="section-header">
                        <span class="section-title">Proyectos</span>
                        <button class="icon-btn small">+</button>
                    </div>
                    <div id="project-list"></div>
                </div>
            </nav>
            <div class="sidebar-footer">
                <button id="theme-toggle" class="nav-item">
                    <span class="icon">🌙</span> <span class="text">Modo Oscuro</span>
                </button>
            </div>
        </aside>

        <div class="main-content">
            <header>
                <h1 id="board-title" style="font-size: 1.2rem; margin: 0;">Selecciona un Proyecto</h1> 
                <div class="controls">
                    <input type="text" id="search-filter" class="filter-input" placeholder="Filtrar por título o #tag..." autocomplete="off">
                    <button id="toggle-view" class="btn">Vista Lista</button>
                </div>
            </header>
            <div id="quick-filters" class="quick-filters-bar">
                <span class="filter-label">Filtros rápidos:</span>
                <button class="filter-pill active" data-filter="">Todos</button>
            </div>
            
            <main id="board-container"></main>
            
            <main id="list-container" style="display: none;">
                <table class="ticket-table">
                    <thead>
                        <tr>
                            <th>ID</th><th>Título</th><th>Estado</th><th>Epic</th><th>Asignado</th><th>Vencimiento</th><th>Etiquetas</th>
                        </tr>
                    </thead>
                    <tbody id="ticket-list-body"></tbody>
                </table>
            </main>
        </div>
    </div>

    <!-- PANEL LATERAL DE EDICIÓN ÚNICO -->
    <div id="side-panel" class="side-panel">
        <div class="panel-header">
            <h2 id="panel-title">Nuevo Ticket</h2>
            <button id="close-panel" class="icon-btn">&times;</button>
        </div>
        <div class="panel-content">
            <form id="ticket-form">
                <input type="hidden" id="ticket-id">
                
                <div class="form-group">
                    <label>Título del ticket *</label>
                    <input type="text" id="ticket-title" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label>Descripción</label>
                    <textarea id="ticket-desc" rows="3"></textarea>
                </div>
                <div style="display: flex; gap: 1rem;">
                    <div class="form-group" style="flex: 1;">
                        <label>Epic</label>
                        <input type="text" id="ticket-epic" placeholder="Ej: Core Engine">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Asignado a</label>
                        <input type="text" id="ticket-assignee" placeholder="Ej: Adrian">
                    </div>
                </div>
                <div style="display: flex; gap: 1rem;">
                    <div class="form-group" style="flex: 1;">
                        <label>Fecha límite</label>
                        <input type="date" id="ticket-due">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Horas registradas</label>
                        <input type="number" id="ticket-time" min="0" value="0">
                    </div>
                </div>
                <div class="form-group">
                    <label>Etiquetas (separadas por coma)</label>
                    <input type="text" id="ticket-tags" placeholder="backend, bug, ui">
                </div>
                <div class="form-actions">
                    <button type="button" class="btn" id="cancel-ticket">Cancelar</button>
                    <button type="submit" class="btn primary">Guardar Ticket</button>
                </div>
            </form>
        </div>
    </div>
    <script src="/static/app.js?v=final"></script>
</body>
</html>
