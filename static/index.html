<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pyckets</title>
    <link rel="stylesheet" href="/static/styles.css?v=v7.2">
</head>
<body>
    <div class="app-layout">
        <!-- ================= BARRA LATERAL ================= -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="logo">🚀 <span>Pyckets</span></div>
                <button id="toggle-sidebar" class="icon-btn" title="Colapsar menú ( [ )">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
                </button>
            </div>

            <div class="sidebar-actions">
                <button class="btn secondary full-width search-btn" id="focus-search">
                    <span class="icon">🔍</span> <span class="text">Buscar...</span>
                    <kbd>Ctrl+K</kbd>
                </button>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section">
                    <span class="section-title">Vistas Globales</span>
                    <a href="#" id="nav-global-all" class="nav-item active">
                        <span class="icon">🏠</span> <span class="text">Todos los Tickets</span>
                    </a>
                    <a href="#" id="nav-global-mine" class="nav-item">
                        <span class="icon">👤</span> <span class="text">Mis Tickets</span>
                    </a>
                </div>

                <div class="nav-section">
                    <div class="section-header">
                        <span class="section-title">Proyectos</span>
                        <button class="icon-btn small" id="btn-open-create-project" title="Nuevo Proyecto">+</button>
                    </div>
                    <div id="project-list"></div>
                </div>
            </nav>

            <div class="sidebar-footer">
                <button id="nav-archived-projects" class="nav-item">
                    <span class="icon">📦</span> <span class="text">Proyectos Archivados</span>
                </button>
            </div>
        </aside>

        <!-- ================= CONTENIDO PRINCIPAL ================= -->
        <div class="main-content">
            <header>
                <h1 id="board-title" style="font-size: 1.2rem; margin: 0;">Todos los Tickets</h1> 
                <div class="controls">
                    <div class="search-container">
                        <input type="text" id="search-filter" class="filter-input" style="width: 320px;" placeholder='Filtrar: @adrian, #bug, is:done, epic:"Core"...' autocomplete="off">
                        <div id="omnibar-suggestions" class="suggestions-dropdown" style="display: none;"></div>
                    </div>
                    <button id="toggle-view" class="btn">Vista Lista</button>
                    <button id="header-new-ticket" class="btn primary" style="display: none;">+ Nuevo Ticket</button>
                    <button id="theme-toggle" class="icon-btn" title="Cambiar tema (Modo Oscuro/Claro)" style="font-size: 1.2rem; padding: 4px 8px;">🌙</button>
                </div>
            </header>

            <!-- VISTA HOME DEL PROYECTO -->
            <main id="project-home" style="display: none; padding: 2rem;">
                <div class="home-dashboard">
                    <h2 id="home-project-name" style="margin-top: 0; font-size: 1.5rem;">Resumen del Proyecto</h2>
                    <div class="stats-grid">
                        <div class="stat-card">
                            <h3>Total de Tickets</h3>
                            <p id="stat-total">0</p>
                        </div>
                        <div class="stat-card">
                            <h3>Completados</h3>
                            <p id="stat-done">0</p>
                        </div>
                    </div>
                    <div style="margin-top: 2rem; display: flex; gap: 1rem;">
                        <button id="btn-go-board" class="btn primary">Ir al Tablero Kanban</button>
                        <button id="btn-archive-project" class="btn" style="color: #ff5630; border-color: #ff5630;">📦 Archivar Proyecto</button>
                    </div>
                </div>
            </main>
            
            <div id="quick-filters" class="quick-filters-bar">
                <span class="filter-label">Filtros rápidos:</span>
                <button class="filter-pill active" data-filter="">Todos</button>
            </div>
            
            <main id="board-container"></main>
            
            <main id="list-container" style="display: none;">
                <table class="ticket-table">
                    <thead>
                        <tr>
                            <th>ID</th><th>Título</th><th>Estado</th><th>Epic</th><th>Asignado</th><th>Vencimiento</th><th>Etiquetas</th>
                        </tr>
                    </thead>
                    <tbody id="ticket-list-body"></tbody>
                </table>
            </main>
        </div>
    </div>

    <!-- PANEL LATERAL DE EDICIÓN ÚNICO -->
    <div id="side-panel" class="side-panel">
        <div class="panel-header">
            <h2 id="panel-title">Nuevo Ticket</h2>
            <button id="close-panel" class="icon-btn">&times;</button>
        </div>
        <div class="panel-content">
            <form id="ticket-form">
                <input type="hidden" id="ticket-id">
                
                <div class="form-group">
                    <label>Título del ticket *</label>
                    <input type="text" id="ticket-title" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label>Descripción</label>
                    <textarea id="ticket-desc" rows="3"></textarea>
                </div>
                <div style="display: flex; gap: 1rem;">
                    <div class="form-group" style="flex: 1;">
                        <label>Epic</label>
                        <input type="text" id="ticket-epic" placeholder="Ej: Core Engine">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Asignado a</label>
                        <input type="text" id="ticket-assignee" placeholder="Ej: Adrian">
                    </div>
                </div>
                <div style="display: flex; gap: 1rem;">
                    <div class="form-group" style="flex: 1;">
                        <label>Fecha límite</label>
                        <input type="date" id="ticket-due">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Horas registradas</label>
                        <input type="number" id="ticket-time" min="0" value="0">
                    </div>
                </div>
                <div class="form-group">
                    <label>Etiquetas (separadas por coma)</label>
                    <input type="text" id="ticket-tags" placeholder="backend, bug, ui">
                </div>
                <div class="form-actions">
                    <button type="button" class="btn" id="cancel-ticket">Cancelar</button>
                    <button type="submit" class="btn primary">Guardar Ticket</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL NUEVO PROYECTO -->
    <div id="project-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3 style="margin-top: 0;">Crear Nuevo Proyecto</h3>
            <form id="project-form">
                <div class="form-group">
                    <label>Nombre del Proyecto</label>
                    <input type="text" id="new-project-name" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label>Color Identificativo</label>
                    <input type="color" id="new-project-color" value="#0052cc" style="padding: 0; height: 40px; cursor: pointer;">
                </div>
                <div class="form-actions">
                    <button type="button" class="btn" id="close-project-modal">Cancelar</button>
                    <button type="submit" class="btn primary">Crear Proyecto</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL PROYECTOS ARCHIVADOS -->
    <div id="archived-projects-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content" style="width: 500px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h3 style="margin: 0;">Proyectos Archivados</h3>
                <button id="close-archived-modal" class="icon-btn">&times;</button>
            </div>
            <div id="archived-project-list" style="max-height: 300px; overflow-y: auto;">
                <!-- Lista dinámica -->
            </div>
        </div>
    </div>

    <script src="/static/app.js?v=v7.2"></script>
</body>
</html>
